$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'application'

tasks:
  # The iOS build itself needs Xcode, so CI typechecks the app and bundles
  # its JavaScript for iOS, which is where a Hermes or Metro problem shows.
  export:
    command: 'expo export --platform ios --output-dir dist'
    deps:
      - '^:build'
    options:
      runInCI: 'skip'

  # Rewrites src/theme.gen.ts from packages/ui's tokens.css. test/theme.test.ts
  # fails CI when the two drift apart.
  theme:
    command: 'bun scripts/theme.ts'
    inputs:
      - '/packages/ui/src/styles/tokens.css'
      - 'scripts/theme.ts'
    outputs:
      - 'src/theme.gen.ts'
    options:
      runInCI: 'always'

  # Inherited from bun-common; widened so a desktop token change re-runs the
  # theme drift test here.
  test:
    inputs:
      - '**/*'
      - '!node_modules/**'
      - '!dist/**'
      - '/packages/ui/src/styles/tokens.css'
